  <body>
    <div id="root">
      <main id="startup-fallback" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f4ed;color:#111827;font-family:system-ui,sans-serif;text-align:center">
        <section style="max-width:560px">
          <p style="font-weight:800;letter-spacing:.16em;color:#b7791f">VATTAMS™</p>
          <h1 style="font-size:clamp(1.5rem,5vw,2.25rem);margin:12px 0">Loading VATTAMS Hybrid Service Marketplace…</h1>
          <p style="color:#6b7280">Please wait while we prepare the marketplace.</p>
          <pre id="startup-error" hidden style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;background:#fff;border:1px solid #e5caca;border-radius:12px;padding:16px;color:#991b1b"></pre>
          <button id="startup-reload" type="button" style="margin-top:16px;padding:10px 20px;border-radius:10px;background:#111827;color:#fff;border:0">Reload page</button>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var errorBox = document.getElementById('startup-error');
        var showStartupError = function (message) {
          if (!root || !errorBox) return;
          errorBox.hidden = false;
          errorBox.textContent = 'The app could not start. Diagnostic: ' + String(message || 'Unknown startup error').slice(0, 1200);
          var heading = root.querySelector('h1');
          if (heading) heading.textContent = 'VATTAMS could not finish loading';
          var detail = root.querySelector('section > p:nth-of-type(2)');
          if (detail) detail.textContent = 'Please share the diagnostic below with support so we can fix the exact cause.';
        };
        window.addEventListener('error', function (event) {
          showStartupError(event.message || (event.target && event.target.src) || 'Script or resource failed to load');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showStartupError(reason && (reason.stack || reason.message) || reason || 'Unhandled promise rejection');
        });
        var reload = document.getElementById('startup-reload');
        if (reload) reload.addEventListener('click', function () { window.location.reload(); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
