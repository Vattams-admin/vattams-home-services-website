version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      npm-security-patch-and-minor:
        applies-to: security-updates
        update-types:
          - patch
          - minor
    cooldown:
      default-days: 3
