name: Deploy Supabase Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production deployment is automatic for every main-branch change.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nfcibyprftnowaiwlxxc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secret
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase Management API access
        run: |
          code="$(curl -sS -o /tmp/supabase-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          if [ "$code" != "200" ]; then
            echo "Supabase Management API authorization failed (HTTP $code)."
            exit 1
          fi
          echo "Supabase Management API access verified for the production project."

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          for fn in admin-auth customer-auth customer-data technician-auth technician-data payment-auth admin-data booking-ops coupon-ops fcm-data notification-ops send-push-notification; do
            supabase functions deploy "$fn" --no-verify-jwt
          done
