name: Deploy Supabase Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production deployment is automatic for every main-branch change.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nfcibyprftnowaiwlxxc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secret
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          for fn in admin-auth customer-auth customer-data technician-auth technician-data payment-auth admin-data booking-ops coupon-ops fcm-data notification-ops send-push-notification; do
            supabase functions deploy "$fn" --no-verify-jwt
          done
