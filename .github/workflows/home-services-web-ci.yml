name: Home Services Web CI

on:
  push:
    branches: [main, 'security/frontend-backend-contract-audit-2026-10-31']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'supabase/functions/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/home-services-web-ci.yml'
      - '.github/workflows/eslint-ci.yml'
      - '.github/workflows/deploy-supabase-production.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-services-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Capture dependency advisory details
        run: npm audit --json > npm-audit-report.json || true
      - name: Upload dependency advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 14
      - run: npm run test:security
      - run: npm run test:migration-history
      - run: npm run test:booking-completion-counter
      - run: npm run test:payment-utr
      - run: npm run test:technician-mobile-guard
      - run: npm run test:registration-payment-activation
      - run: npm run test:customer-data-input-validation
      - run: npm run test:technician-data-query-errors
      - run: npm run test:technician-photo-upload
      - run: npm run test:notification-push-retry-worker
      - run: npm run typecheck
      - run: npm run build
