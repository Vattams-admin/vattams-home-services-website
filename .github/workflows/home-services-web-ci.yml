name: Home Services Web CI

on:
  push:
    branches: [main, 'security/frontend-backend-contract-audit-2026-10-31']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'supabase/functions/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/home-services-web-ci.yml'
      - '.github/workflows/deploy-supabase-production.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-services-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture dependency advisory details
        run: npm audit --json || true
      - run: npm run test:security
      - run: npm run test:migration-history
      - run: npm run typecheck
      - run: npm run build
