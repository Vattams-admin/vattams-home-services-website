name: Auth Runtime Dependency Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/customer-auth/index.ts"
      - "supabase/functions/technician-auth/index.ts"
      - "scripts/security-contract-check.mjs"
      - ".github/workflows/auth-runtime-dependency-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-runtime-contract:
    name: Validate auth Edge Function dependency alignment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run security contract checks
        run: node scripts/security-contract-check.mjs
