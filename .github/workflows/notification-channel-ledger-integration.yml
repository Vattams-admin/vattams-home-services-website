name: Notification Channel Ledger PostgreSQL Integration

on:
  pull_request:
    paths:
      - "supabase/migrations/20261105160000_notification_channel_delivery_ledger.sql"
      - ".github/workflows/notification-channel-ledger-integration.yml"

jobs:
  notification-ledger-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_services_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_services_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: home_services_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create production-shaped notification fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.notifications (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            recipient_type text NOT NULL CHECK (recipient_type IN ('customer','technician','admin')),
            recipient_id text NOT NULL,
            title text NOT NULL,
            message text NOT NULL,
            type text NOT NULL,
            reference_type text,
            reference_id text,
            channels text[] NOT NULL DEFAULT ARRAY['in_app']::text[],
            status text NOT NULL DEFAULT 'sent' CHECK (status IN ('sent','delivered','read','failed')),
            is_read boolean NOT NULL DEFAULT false,
            read_at timestamptz,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Apply notification channel ledger migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105160000_notification_channel_delivery_ledger.sql
      - name: Verify atomic creation, channel states, and privileges
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE service_role;
          DO $$
          DECLARE
            v_notification jsonb;
            v_id uuid;
            v_count integer;
            v_in_app_status text;
            v_push_status text;
          BEGIN
            v_notification := public.create_notification_with_channel_deliveries(
              'customer','test-customer','Test title','Test message','test_event',
              NULL,NULL,ARRAY['in_app','push']::text[]
            );
            v_id := (v_notification->>'id')::uuid;
            SELECT count(*) INTO v_count
              FROM public.notification_channel_deliveries
             WHERE notification_id = v_id;
            IF v_count <> 2 THEN RAISE EXCEPTION 'Expected 2 channel rows, got %', v_count; END IF;
            SELECT status INTO v_in_app_status FROM public.notification_channel_deliveries
             WHERE notification_id = v_id AND channel = 'in_app';
            SELECT status INTO v_push_status FROM public.notification_channel_deliveries
             WHERE notification_id = v_id AND channel = 'push';
            IF v_in_app_status <> 'succeeded' THEN RAISE EXCEPTION 'in_app should start succeeded'; END IF;
            IF v_push_status <> 'pending' THEN RAISE EXCEPTION 'push should start pending'; END IF;
            UPDATE public.notification_channel_deliveries
               SET status='partial', attempt_count=1, delivered_count=1, failed_count=2
             WHERE notification_id=v_id AND channel='push';
            IF NOT EXISTS (
              SELECT 1 FROM public.notification_channel_deliveries
               WHERE notification_id=v_id AND channel='push'
                 AND status='partial' AND delivered_count=1 AND failed_count=2
            ) THEN RAISE EXCEPTION 'Partial delivery outcome was not persisted'; END IF;
            BEGIN
              PERFORM public.create_notification_with_channel_deliveries(
                'customer','test-customer','Bad','Bad','test_event',
                NULL,NULL,ARRAY['email']::text[]
              );
              RAISE EXCEPTION 'Unsupported channel unexpectedly accepted';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'Unsupported channel unexpectedly accepted' THEN RAISE; END IF;
            END;
          END;
          $$;
          RESET ROLE;
          DO $$
          BEGIN
            IF has_table_privilege('anon','public.notification_channel_deliveries','SELECT') THEN
              RAISE EXCEPTION 'anon unexpectedly has ledger SELECT privilege';
            END IF;
            IF has_function_privilege('anon','public.create_notification_with_channel_deliveries(text,text,text,text,text,text,text,text[])','EXECUTE') THEN
              RAISE EXCEPTION 'anon unexpectedly has RPC execute privilege';
            END IF;
            IF NOT has_function_privilege('service_role','public.create_notification_with_channel_deliveries(text,text,text,text,text,text,text,text[])','EXECUTE') THEN
              RAISE EXCEPTION 'service_role is missing RPC execute privilege';
            END IF;
          END;
          $$;
          ROLLBACK;
          SQL
