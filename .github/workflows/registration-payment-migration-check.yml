name: Registration Payment Migration Contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/p0-registration-payment-activation-guard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-contract:
    name: Validate registration payment activation migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check migration contract
        run: npm run test:registration-payment-activation
